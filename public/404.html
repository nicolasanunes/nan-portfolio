<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redireciona para o index.html com a rota preservada
      const path = window.location.pathname
      window.location.replace('/' + (path === '/' ? '' : '?redirect=' + path))
    </script>
  </head>
  <body></body>
</html>
